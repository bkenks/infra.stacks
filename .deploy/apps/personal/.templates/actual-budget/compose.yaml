---
services:
  actual-budget:
    image: docker.io/actualbudget/actual-server@sha256:6e64dab321cd0cde89b6a8fefe92dd2f083c6e0f58139c03dc4cf2c8902657a3
    container_name: ${COMPOSE_PROJECT_NAME}_actual-budget
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "node src/scripts/health-check.js" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 25s

# Not from upstream frappe_docker.
#
# Puts the MariaDB root password in Infisical instead of the repo. The provider
# injects every secret at the path as a plain container environment variable into
# each service that declares depends_on on it, under the secret's own name — so
# the bundle must hold a key called exactly MYSQL_ROOT_PASSWORD.
#
# Append this file after compose.mariadb.yaml in the stack's file_paths. !reset
# drops the upstream ${DB_PASSWORD} interpolation so the injected value lands
# without colliding with a compose-level one.
services:
  secrets:
    provider:
      type: infisical-secrets
      options:
        credentials-file: /mnt/secrets/credentials/infisical.env
        domain: http://controlplane.internal:18043
        project-id: 12ed25dd-c0d2-4a78-9b10-472fc09fe554
        env: prod
        path: /
        recursive: true

  db:
    depends_on:
      secrets:
        condition: service_started
    environment:
      MYSQL_ROOT_PASSWORD: !reset null

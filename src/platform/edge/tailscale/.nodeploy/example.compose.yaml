name: tailnet-gateway
networks:
  tailnet:
    name: tailnet
    external: true          # created once by infra.ansible, like `proxy`
services:
  tailscale:
    container_name: tailnet-gateway
    image: tailscale/tailscale@sha256:f15d5d3f4a68773a853180b72496f70ba614b64de0878c43fe3da39fe0afba47  # v1.98.9
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?err}
      TS_HOSTNAME: tailnet-gw
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"        # no tun/NET_ADMIN needed for a pure proxy
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --advertise-tags=tag:gateway
    volumes:
      - tailscale:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    networks: [tailnet]
    restart: always
volumes:
  tailscale:
    name: tailnet_gateway_state
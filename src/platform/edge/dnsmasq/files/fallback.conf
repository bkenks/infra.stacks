# Layered onto dockurr/dnsmasq's default config via /etc/dnsmasq.d/. Upstreams come from
# the DNS1/DNS2 env vars (set in compose.jsonnet); this file adds everything else.

# Forward only to DNS1/DNS2 — ignore the container's Docker-injected /etc/resolv.conf.
no-resolv
# Ignore the container's own /etc/hosts (localhost/self entries); records live in the
# addn-hosts file below instead.
no-hosts

# Static / fallback records — authoritative, always win over upstream, resolve even when
# upstream DNS is down. This is the emergency fallback.
addn-hosts=/etc/dnsmasq/hosts

# Try upstreams in listed order (DNS1 then DNS2) rather than fastest-wins, so the primary
# resolver is preferred and the public server is a true fallback.
strict-order

# Don't forward unqualified single-label names or reverse lookups for private ranges upstream.
domain-needed
bogus-priv

cache-size=1000

# Uncomment to log every query/answer while debugging:
#log-queries

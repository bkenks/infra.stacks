# Garage single-node config. Mounted read-only at /etc/garage.toml — the path Garage reads
# by default and the only one it looks at without `-c`. There is no auto-generated config:
# with this file missing the daemon exits immediately on "No such file or directory".
#
# Deliberately holds no secrets. rpc_secret and admin_token are supplied as GARAGE_RPC_SECRET
# and GARAGE_ADMIN_TOKEN from the env file on the NAS, because Garage refuses to start when a
# config file containing secrets is world-readable — easy to trip on a /volume1 bind mount.
# That is also what lets this file live in git alongside the stack.

# Must match the volume mounts in stack.jsonnet. If they drift, Garage writes into the
# container's writable layer and every object is lost on the next recreate.
metadata_dir = "/var/lib/garage/meta"
data_dir     = "/var/lib/garage/data"
db_engine    = "lmdb"

# Single node: one copy of every partition. Durability comes from the NAS array underneath,
# not from Garage. Raising this on a one-node cluster only makes it refuse to start.
replication_factor = 1

# Cluster RPC. Bound inside the container and never published — a single node only ever
# dials itself, and an exposed 3901 plus the RPC secret is enough to join the cluster.
rpc_bind_addr   = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region     = "garage"
api_bind_addr = "[::]:3900"
root_domain   = ".s3.garage"

[admin]
api_bind_addr = "[::]:3903"

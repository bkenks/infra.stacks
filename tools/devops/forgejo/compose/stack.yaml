name: ${FORGEJO__NAME}

---

networks:
  default:  # override default network name to be "internal"
    name:  ${COMPOSE_PROJECT_NAME}_internal
  proxy:  # add reverse proxy network to forward traffic
    external: true

volumes:
  server: {}
  db: {}

---

services:
  server:
    # Temporarily pulling from clone since codeberg/forgejo is having problems
    image: forgejoclone/forgejo:15    # codeberg.org/forgejo/forgejo:15
    restart: on-failure:${MAX_RESTART_ATTEMPS:?err}
    volumes:
      - server:/data
      - /etc/localtime:/etc/localtime:ro
    expose:
      - '3000'
      - '22'
    networks:
      - default   # required
      - proxy
    labels:
      traefik.enable: 'true'
      traefik.http.routers.forgejo.rule: 'Host(`fj.homektb.com`)'
      traefik.http.routers.forgejo.entrypoints: websecure
      traefik.http.routers.forgejo.tls: 'true'
      traefik.http.services.forgejo.loadbalancer.server.port: '3000'
      # --- SSH (raw TCP) ---
      traefik.tcp.routers.forgejo-ssh.rule: 'HostSNI(`*`)'
      traefik.tcp.routers.forgejo-ssh.entrypoints: forgejo-ssh
      traefik.tcp.services.forgejo-ssh.loadbalancer.server.port: '22'

  db:
    image: postgres:14
    restart: on-failure:${MAX_RESTART_ATTEMPS:?err}
    volumes:
      - db:/var/lib/postgresql/data
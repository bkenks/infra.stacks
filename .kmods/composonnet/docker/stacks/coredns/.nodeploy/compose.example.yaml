---
name: coredns

networks:
  dnsnet:
    name: dnsnet
    ipam:
      config:
        - subnet: 10.200.0.0/24

services:
  coredns:
    image: coredns/coredns:1.14.6   # verify current tag
    container_name: coredns
    command: -conf /etc/coredns/Corefile
    restart: unless-stopped
    networks:
      dnsnet:
        ipv4_address: 10.200.0.53
    volumes:
      - ./Corefile:/etc/coredns/Corefile:ro
      - ./internal.zone:/etc/coredns/internal.zone:ro

# Interpolated environment values (secrets + ${...} config).
#
# A service's `env_file:` is NOT interpolated against the include's env_file
# scope, so any ${VAR} placed in container-envs/*.env resolves to empty. The
# compose *body* IS interpolated against that scope (interpolation-envs/*.env +
# /dev/shm/node_zerobyte.env), so every value needing ${...} is set here as an
# `environment:` entry.
#
#   container-envs/zerobyte.env  -> literal values only
#   this file                    -> anything containing ${...}
services:
  zerobyte:
    environment:
      # 32+ char secret that encrypts stored backend credentials in zerobyte's
      # local DB. Rendered to /dev/shm/node_zerobyte.env by this host's
      # infisical-agent (Infisical /zerobyte -> ZEROBYTE_APP_SECRET). Must stay
      # STABLE — changing it makes existing encrypted data undecryptable.
      APP_SECRET: ${ZEROBYTE_APP_SECRET:?err}
      # External URL Traefik serves this instance on (per host). Must match the
      # router host above or zerobyte's links/redirects break.
      BASE_URL: https://zerobyte.${ZEROBYTE__HOST:?err}.${ZEROBYTE__BASE_DOMAIN:?err}

---
services:
  traefik:
    image: docker.io/library/traefik:${TRAEFIK__VERS_TAG:?err}
    env_file: ../container-envs/traefik.env
    environment:
      # Scoped Cloudflare API token for the DNS-01 ACME challenge. Sourced from
      # /dev/shm/cloudflared-bootstrap.env via the include env_file scope
      # (see ../compose.yaml); the lego provider reads it from this env.
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?err}
    restart: unless-stopped
    # Traefik is THIS host's reverse proxy: it owns 80/443. Dokploy-traefik must
    # be stopped first or these binds will conflict.
    ports:
      - '80:80'
      - '443:443'
      # Forgejo git-over-SSH (forgejo-ssh entrypoint). Host :22 — only free once
      # admin sshd has moved to 3204 (infra.ansible). Redeploy AFTER that cutover.
      - '22:22'
    volumes:
      # Read-only docker socket — Traefik discovers containers labelled
      # traefik.enable=true on the shared `proxy` network.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../files/traefik.yml:/etc/traefik/traefik.yml:ro
      # Per-host dynamic config, selected by AGENT_HOST (the Komodo per-server
      # variable already set on every host — same one the infisical-agent uses).
      # It carries the dashboard router + THIS host's ACME cert domains. The
      # `:?` guard fails the deploy loudly if AGENT_HOST is unset. The traefik.yml
      # `file` provider watches /etc/traefik/dynamic, so this single mounted file
      # is the host's whole dynamic config. Add a host: create
      # files/configs/<host>.yml (copy paiki.yml for a homektb-only subserver).
      - ../files/configs/${AGENT_HOST:?AGENT_HOST is required — selects files/configs/<host>.yml}.yml:/etc/traefik/dynamic/host.yml:ro
      # Persist the ACME account + issued certs (acme.json) across redeploys so
      # we don't re-request the wildcards (and risk LE rate limits) each time.
      - letsencrypt:/letsencrypt
    networks:
      - proxy
    healthcheck:
      test: [ "CMD", "traefik", "healthcheck", "--ping" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  letsencrypt:

networks:
  # This stack OWNS the shared reverse-proxy network. The explicit `name: proxy`
  # makes Docker create it as literally "proxy" (no project prefix), so other
  # stacks can join it as an external network named "proxy". Deploy Traefik FIRST
  # so the network exists before any app that references it.
  proxy:
    name: proxy
    external: true

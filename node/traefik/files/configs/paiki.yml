# Per-host Traefik dynamic config for paiki (subserver). Selected by AGENT_HOST
# via the compose volume mount (../compose/stack.yml) and loaded by the `file`
# provider (../files/traefik.yml). Mounted as-is — Docker Compose does NOT
# interpolate ${VARS} here, so everything is a literal.
#
# Defines the Traefik dashboard router and the ACME (Cloudflare DNS-01) cert
# domains THIS host requests. paiki serves *.homektb.com (legacy/shared names)
# AND *.paiki.homektb.com — the per-host dotted scheme (<service>.paiki.…).
http:
  routers:
    dashboard:
      rule: "Host(`traefik.paiki.homektb.com`)"
      entryPoints:
        - websecure
      service: api@internal
      tls:
        certResolver: cloudflare
        # Request both wildcards once, here. Traefik serves each for its matching
        # hosts via SNI, so app routers need only `tls: true`.
        # *.homektb.com -> legacy/shared single-label names (immich, …)
        # *.paiki.homektb.com -> the dotted per-host scheme (<svc>.paiki.…).
        domains:
          - main: homektb.com
            sans:
              - "*.homektb.com"
              - "*.paiki.homektb.com"

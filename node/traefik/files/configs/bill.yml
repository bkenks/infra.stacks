# Per-host Traefik dynamic config for littlebuddy (control-plane). Selected by
# AGENT_HOST via the compose volume mount (../compose/stack.yml) and loaded by
# the `file` provider (../files/traefik.yml). Mounted as-is — Docker Compose does
# NOT interpolate ${VARS} here, so everything is a literal.
#
# Defines the Traefik dashboard router and the ACME (Cloudflare DNS-01) cert
# domains THIS host requests. littlebuddy serves *.homektb.com (legacy/shared
# names) AND *.lilbud.homektb.com — the per-host dotted scheme where every
# internal service is reachable at <service>.lilbud.homektb.com. The dotted
# host token is "lilbud" even though AGENT_HOST is "littlebuddy".
#
# Add a host: copy this file to files/configs/<host>.yml (this is the
# homektb-only template; see maboi.yml for a host that adds extra zones).
http:
  routers:
    dashboard:
      rule: "Host(`traefik.lilbud.homektb.com`) || Host(`traefik.homektb.com`)"
      entryPoints:
        - websecure
      service: api@internal
      tls:
        certResolver: cloudflare
        # Request both wildcards once, here. Traefik then serves each for its
        # matching hosts via SNI, so app routers need only `tls: true`.
        # *.homektb.com  -> legacy/shared single-label names (infisical, komo, …)
        # *.lilbud.homektb.com -> the dotted per-host scheme (<svc>.lilbud.…).
        domains:
          - main: homektb.com
            sans:
              - "*.homektb.com"
              - "*.lilbud.homektb.com"

# Per-host Traefik dynamic config for maboi (subserver, public-facing apps).
# Selected by AGENT_HOST via the compose volume mount (../compose/stack.yml) and
# loaded by the `file` provider (../files/traefik.yml). Mounted as-is — Docker
# Compose does NOT interpolate ${VARS} here, so everything is a literal.
#
# Defines the Traefik dashboard router and the ACME (Cloudflare DNS-01) cert
# domains THIS host requests. maboi hosts the public client/Stackform sites, so
# in addition to *.homektb.com it requests the *.stackform.app and
# *.couchpotatoes.store wildcards.
#
# ⚠️ CF_DNS_API_TOKEN must hold Zone:DNS:Edit + Zone:Read on ALL three zones
# (homektb.com, stackform.app, couchpotatoes.store), and they must live in the
# SAME Cloudflare account (one token). When a stackform.app / couchpotatoes.store
# service gets its own router on its own stack later, you can move that domain
# entry onto that router and drop it from here.
http:
  routers:
    dashboard:
      rule: "Host(`traefik.maboi.homektb.com`)"
      entryPoints:
        - websecure
      service: api@internal
      tls:
        certResolver: cloudflare
        # Each wildcard is requested once, here. Traefik then serves it for every
        # matching host via SNI, so app routers need only `tls: true`.
        domains:
          - main: homektb.com
            sans:
              - "*.homektb.com"
              # Dotted per-host scheme: <service>.maboi.homektb.com.
              - "*.maboi.homektb.com"
          - main: stackform.app
            sans:
              - "*.stackform.app"
          - main: couchpotatoes.store
            sans:
              - "*.couchpotatoes.store"

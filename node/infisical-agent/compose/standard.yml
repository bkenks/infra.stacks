# STANDARD profile — long-running, Komodo-managed, deployed to every host.
# Creds come from Komodo per-server variables (env); entrypoint.sh writes them to
# /dev/shm and the agent removes the secret on read (remove_client_secret_on_read).
# Reaches Infisical at its public URL (resolved via normal DNS on the host).
services:
  agent:
    image: docker.io/infisical/cli:${INFISICAL_AGENT__VERS_TAG:?err}
    container_name: infisical-agent
    profiles: [ "standard" ]
    entrypoint: [ "/bin/sh", "/agent/entrypoint.sh" ]
    environment:
      AGENT_HOST: ${AGENT_HOST:?err}                 # selects files/configs/<host>.yaml
      # Soft defaults so the `init` profile can render without these (compose
      # interpolates every service regardless of active profile). entrypoint.sh
      # enforces their presence at runtime for the standard agent.
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
    volumes:
      - ../files/entrypoint.sh:/agent/entrypoint.sh:ro
      - ../files/configs:/agent-configs:ro
      - /dev/shm:/dev/shm
    restart: unless-stopped
    # The agent stays "running" even when a template/auth permanently fails (wrong
    # secret path, or Infisical unreachable -> repeated ERR + retry), so liveness
    # never flips it. entrypoint.sh stamps /tmp/agent.last_err with the epoch of
    # every ERR/FTL/PNC line; we flag the container unhealthy only while an error
    # was logged within the last 180s. Why a window and not a plain grep: the agent
    # is SILENT on success, so a historical error log can't say the agent is
    # "currently fine" — old ERR lines would pin it unhealthy forever. A still-broken
    # agent re-logs inside the window (auth retries ~30s, template polls 1m) and stays
    # unhealthy; once errors stop, the stamp ages past 180s and the container recovers
    # on its own, no restart. `$$` escapes `$` past compose interpolation so the
    # arithmetic runs in the container shell, not at compose-parse time.
    healthcheck:
      test: [ "CMD-SHELL", "[ ! -f /tmp/agent.last_err ] || [ $$(( $$(date +%s) - $$(cat /tmp/agent.last_err) )) -ge 180 ]" ]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 30s

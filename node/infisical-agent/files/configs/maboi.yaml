# STANDARD agent config for maboi (subserver). Deployed by Komodo. Add one
# templates block per stack that runs on this host — point source-path at the
# shared template /agent-templates/<stack>.tpl (see littlebuddy.yaml for the
# pattern). Scope maboi's machine identity in Infisical to only these folders.
#
# Other subservers (e.g. biggy, a VPS) follow the same pattern: copy this file to
# files/configs/<host>.yaml and list that host's stacks.
infisical:
  address: "https://infisical.homektb.com"
  exit-after-auth: false
  revoke-credentials-on-shutdown: false

auth:
  type: "universal-auth"
  config:
    client-id: "/dev/shm/agent.client-id"
    client-secret: "/dev/shm/agent.client-secret"
    remove_client_secret_on_read: true

templates:
  # ============ Section: Start ============
  # Node: Infra

  # cloudflared
  - source-path: /agent-templates/node_cloudflared.tpl
    destination-path: /dev/shm/node_cloudflared.env
    config:
      polling-interval: "1m"

  # Node: zerobyte
  - source-path: /agent-templates/node_zerobyte.tpl
    destination-path: /dev/shm/node_zerobyte.env
    config:
      polling-interval: "1m"

  # Node: traefik (Cloudflare API token for DNS-01 wildcard TLS)
  - source-path: /agent-templates/node_traefik.tpl
    destination-path: /dev/shm/node_traefik.env
    config:
      polling-interval: "1m"

  # Node: Infra
  # ============  Section: End  =============




  # Client: couch-potatoes website
  - source-path: /agent-templates/client_couch-potatoes_website.tpl
    destination-path: /dev/shm/client_couch-potatoes_website.env
    config:
      polling-interval: "1m"

  # Stackform website
  - source-path: /agent-templates/stackform_website.tpl
    destination-path: /dev/shm/stackform_website.env
    config:
      polling-interval: "1m"




  # To add a stack: copy a block above, swap the source-path to the shared
  # template, and set destination-path to /dev/shm/<stack>.env.
  # - source-path: /agent-templates/<stack>.tpl
  #   destination-path: /dev/shm/<stack>.env
  #   config:
  #     polling-interval: "1m"

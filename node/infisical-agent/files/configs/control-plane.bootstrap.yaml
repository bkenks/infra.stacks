# INIT (one-shot) config for the control-plane COLD bootstrap. Renders ONLY the
# tier-0 secrets needed to bring up the orchestration layer (Komodo) + proxy
# (Traefik) + tunnel (Cloudflare) BEFORE Komodo exists to manage anything, then
# EXITS. Run by Ansible (`--tags infisical-agent`). Once Komodo is up, the
# host's standard agent (<host>.yaml) takes over and this is never used again.
#
# NOT host-specific: this is the control-plane bootstrap, selected by a fixed
# AGENT_CONFIG_NAME (see compose/init.yml + entrypoint.sh), so it stays the same
# regardless of which host happens to be the control plane. AGENT_HOST still
# carries the real host name for the per-host ${AGENT_HOST} secret-path subs.
#
# Reaches the Infisical app DIRECTLY over the proxy network (Traefik/the public
# URL don't exist yet at cold bootstrap). `infisical-app` is the app's alias on
# the proxy network (see stack.infra/infisical/compose/stack.yml).
# NOTE: this is internal HTTP. The agent's machine-identity API works over HTTP;
# the HTTPS requirement is for the browser/web UI. If your instance rejects the
# agent over HTTP, the alternative is to bring Traefik up first.
#
# Templates are shared with the standard agent (files/configs/templates/*.tpl,
# referenced as /agent-templates/<stack>.tpl after entrypoint.sh substitutes
# ${AGENT_HOST}); only the destination-path differs from the host's <host>.yaml.
infisical:
  address: "http://infisical-app:8080"
  exit-after-auth: true               # render once, then exit
  revoke-credentials-on-shutdown: false

auth:
  type: "universal-auth"
  config:
    # .init prefix keeps these separate from the standard agent's
    # /dev/shm/agent.client-id (Ansible writes these; entrypoint.sh derives the
    # same paths from AGENT_CONFIG_SUFFIX). Avoids the cross-uid overwrite
    # collision on the sticky /dev/shm.
    client-id: "/dev/shm/agent.init.client-id"
    client-secret: "/dev/shm/agent.init.client-secret"
    remove_client_secret_on_read: true

templates:
  # Komodo Core + Mongo — shared template renders the FINAL container env var
  # names komodo/compose reads via service env_file (core uses KOMODO_*, mongo
  # MONGO_*; DB user/pass are the same value for both). Secrets live under /komodo.
  - source-path: /agent-templates/komodo_core.tpl
    destination-path: /dev/shm/komodo_core.env

  # Node: cloudflared — per-host tunnel token (shared template resolves
  # /hosts/<host>/cloudflared via the ${AGENT_HOST} substitution).
  - source-path: /agent-templates/node_cloudflared.tpl
    destination-path: /dev/shm/cloudflared.env

  # Node: traefik (Cloudflare API token for DNS-01 wildcard TLS)
  - source-path: /agent-templates/node_traefik.tpl
    destination-path: /dev/shm/traefik.env

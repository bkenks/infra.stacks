---
name: databasus
---

networks:
  db-backups:               # Managed by: Ansible
    name: db-backups
    external: true
  proxy:                    # Managed by: Traefik
    name: proxy
    external: true

volumes:
  databasus_data: {}
  
---

services:
  databasus:
    image: databasus/databasus@sha256:f748c20cecb3cf3162d80ebfddd4f192b5e4ee640d600c9daf726310ac49e51c
    volumes:
      - databasus_data:/databasus-data
    networks:
      - default
      - db-backups
      - proxy
    restart: unless-stopped
    labels:
      traefik.enable: 'true'
      traefik.http.routers.databasus.rule: 'Host(`databasus.${DATABASUS__HOST:?err}.homektb.com`)'  # Define host at runtime to create unique url
      traefik.http.routers.databasus.entrypoints: websecure
      traefik.http.routers.databasus.tls: 'true'
      traefik.http.services.databasus.loadbalancer.server.port: '4005'                              # Web UI port (internal — Traefik routes to it; not published on the host).

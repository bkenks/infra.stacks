---
services:
  app:
    image: cloudflare/cloudflared:${CLOUDFLARED__VERS_TAG}
    env_file: ../container-envs/cloudflared.env
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    # Join the shared reverse-proxy network so tunnel ingress can target Traefik
    # by name (e.g. service `https://traefik:443`). Docker DNS only resolves
    # container names within a shared network. Outbound internet egress (to the
    # Cloudflare edge) still works from this user-defined bridge.
    networks:
      - proxy

networks:
  # Shared reverse-proxy network, OWNED/created by the traefik stack. We just
  # join it here — so the traefik stack must be deployed before this one.
  proxy:
    external: true
    name: proxy

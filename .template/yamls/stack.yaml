services:
  app:
    image: forge.example/namespace/image:${APP__VERSION:?err}
    volumes:
      - app_data:/data
    env_file:
      - "../container-envs/${APP__NAME:?err}.env"
    restart: on-failure:${APP__MAX_RESTART_ATTEMPS:?err}
    healthcheck:
      test: [ "CMD", "true" ]
      interval: 15s
      timeout: 5s
      retries: 10
    expose:
      - 'HOST_PORT:CONTAINER_PORT'

volumes:
  app_data: {}

# Interpolated environment values (secrets).
#
# Why this file exists:
#   A service's `env_file:` is NOT interpolated against the include's env_file
#   scope, so any `${VAR}` placed in container-envs/*.env resolves to an empty
#   string. The compose *body* IS interpolated against that scope
#   (interpolation-envs/main.env + /dev/shm/stream.env), so every value that
#   needs interpolation — here, the *arr API keys — must be set as an
#   `environment:` entry in this file, which is merged onto compose/stack.yaml.
#
#   container-envs/*.env  -> literal values only
#   this file             -> anything containing ${...}
#
# Secrets are rendered to host RAM (/dev/shm/stream.env) by the infisical-agent,
# which compose.yaml pulls into the interpolation scope via `include: -> env_file:`.
# Store them in Infisical under the "/stream" folder, "prod" environment:
#   SONARR_API_KEY   Sonarr API key (Sonarr → Settings → General → Security)
#   RADARR_API_KEY   Radarr API key (Radarr → Settings → General → Security)
# Configarr reads them via `!env` in ../configarr/config.yml; Decluttarr via
# `!ENV` in ../decluttarr/config.yaml — both need the same two keys.
services:
  configarr:
    environment:
      SONARR_API_KEY: ${SONARR_API_KEY:?err}
      RADARR_API_KEY: ${RADARR_API_KEY:?err}
  decluttarr:
    environment:
      SONARR_API_KEY: ${SONARR_API_KEY:?err}
      RADARR_API_KEY: ${RADARR_API_KEY:?err}

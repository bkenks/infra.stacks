# Secret / cross-service env. A service's env_file: is NOT interpolated, so any
# value with ${...} must live in the compose body. This file merges into the
# docuseal service (via the include's path: list) and its ${...} resolve against
# interpolation-envs/main.env + /dev/shm/apps_docuseal.env (rendered by the
# infisical-agent on this same host).
services:
  app:
    environment:
      # Canonical host. Doubles as the SSL switch (forces HTTPS redirects) and
      # the host DocuSeal uses to build absolute signing-link URLs in emails.
      # Caddy terminates TLS and forwards X-Forwarded-Proto.
      FORCE_SSL: "docuseal.homektb.com"
      DATABASE_URL: "postgresql://${POSTGRES_USER:?err}:${POSTGRES_PASS:?err}@postgres:5432/docuseal"
      SECRET_KEY_BASE: "${DOCUSEAL_SECRET_KEY_BASE:?err}"

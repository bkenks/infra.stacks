# Interpolated environment values (secrets + cross-referenced config).
#
# Why this file exists (same pattern as infisical/compose/secrets.yml in
# stack.infra): a service's `env_file:` is NOT interpolated against the include's
# `env_file:` scope, so any ${VAR} placed in container-envs/*.env resolves to an
# empty string. The compose *body* IS interpolated against that scope, so every
# value needing ${...} — especially secrets — must be set here as an
# `environment:` entry.
#
#   container-envs/*.env  -> literal values only
#   this file             -> anything containing ${...}
#
# Secrets are rendered to host RAM (/dev/shm/frappe.env) by the
# infisical-agent (stack.infra/infisical), which the wrapper docker-compose.yml
# pulls into the interpolation scope via `include: -> env_file:`. Store the key
# in Infisical under the "/frappe" folder, "prod" environment:
#   FRAPPE_DB_ROOT_PASSWORD   MariaDB root password (also used for bench new-site)
services:
  db:
    environment:
      MYSQL_ROOT_PASSWORD: ${FRAPPE_DB_ROOT_PASSWORD:?err}

  # backend gets the root password too, so `bench new-site` / `bench drop-site`
  # (the only ops that need DB root) can use "$FRAPPE_DB_ROOT_PASSWORD" directly
  # in an exec session. Trade-off: the root password lives in this long-running
  # container's env (visible to `docker inspect`), not just transiently at exec.
  backend:
    environment:
      FRAPPE_DB_ROOT_PASSWORD: ${FRAPPE_DB_ROOT_PASSWORD:?err}

# Secret / cross-service env. A service's env_file: is NOT interpolated, so any
# value with ${...} must live in the compose body. This file merges into the
# services below (via the include's path: list) and their ${...} resolve against
# interpolation-envs/main.env + /dev/shm/openproject.env + /dev/shm/postgres.env
# (rendered by the infisical-agent on this same host).
services:
  web:
    environment: &openproject-secrets
      DATABASE_URL: "postgres://${POSTGRES_USER:?err}:${POSTGRES_PASS:?err}@postgres:5432/openproject?pool=20&encoding=unicode&reconnect=true"
      SECRET_KEY_BASE: "${OPEN_PRJ_SECRET_KEY:?err}"
      OPENPROJECT_COLLABORATIVE__EDITING__HOCUSPOCUS__SECRET: "${COLLAB_SERVER_SECRET:?err}"
  cron:
    environment: *openproject-secrets
  seeder:
    environment: *openproject-secrets
  worker:
    environment: *openproject-secrets
  hocuspocus:
    environment:
      SECRET: "${COLLAB_SERVER_SECRET:?err}"

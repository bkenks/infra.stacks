---

name: openproject

---

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}_internal
  postgres_shared:
    name: postgres_shared
    external: true

volumes:
  assets:

---

services:
  autoheal:
    image: willfarrell/autoheal:1.2.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  cache:
    image: memcached
    restart: unless-stopped

  cron:
    image: openproject/openproject:17-slim
    depends_on:
      - cache
      - seeder
    volumes:
      - type: volume
        source: assets
        target: /var/openproject/assets
    command: "./docker/prod/cron"
    restart: unless-stopped
    networks:
      - default
      - postgres

  hocuspocus:
    image: openproject/hocuspocus:17.1.2
    ports:
      - '1234:1234'
    restart: unless-stopped

  seeder:
    image: openproject/openproject:17-slim
    volumes:
      - type: volume
        source: assets
        target: /var/openproject/assets
    command: "./docker/prod/seeder"
    restart: on-failure
    networks:
      - postgres

  web:
    image: openproject/openproject:17-slim
    depends_on:
      - cache
      - seeder
    volumes:
      - type: volume
        source: assets
        target: /var/openproject/assets
    command: "./docker/prod/web"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health_checks/default" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
    hostname: "${OPENPROJECT_HOST__NAME:-localhost:8080}"
    ports:
      - '8080:8080'
    networks:
      - postgres

  worker:
    image: openproject/openproject:17-slim
    depends_on:
      - cache
      - seeder
    volumes:
      - type: volume
        source: assets
        target: /var/openproject/assets
    command: "./docker/prod/worker"
    restart: unless-stopped
    networks:
      - postgres
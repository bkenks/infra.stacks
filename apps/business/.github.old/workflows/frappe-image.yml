name: Build Frappe image

# Builds the custom Frappe + ERPNext + HR image from frappe/image/apps.json and
# pushes it to GHCR. Komodo only pulls the result — it never builds.
#
# Triggers on changes to the app list or this workflow, plus manual dispatch
# (use the dispatch to rebuild after an upstream app release without an
# apps.json change).

on:
  push:
    branches: [main]
    paths:
      - frappe/image/apps.json
      - .github/workflows/frappe-image.yml
  workflow_dispatch:
    inputs:
      frappe_branch:
        description: Frappe/ERPNext/HR branch to build
        default: version-15
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ktbgroup-self-hosted/frappe
  FRAPPE_BRANCH: version-15

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (for apps.json)
        uses: actions/checkout@v4

      - name: Checkout frappe_docker (build context)
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve branch
        id: vars
        env:
          INPUT_BRANCH: ${{ github.event.inputs.frappe_branch }}
        run: |
          branch="${INPUT_BRANCH:-$FRAPPE_BRANCH}"
          # Allow only a safe branch token (letters, digits, dot, dash, slash, underscore).
          if ! printf '%s' "$branch" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "Invalid branch: $branch" >&2
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Build and push
        working-directory: frappe_docker
        env:
          BRANCH: ${{ steps.vars.outputs.branch }}
        run: |
          cp ../frappe/image/apps.json apps.json
          docker buildx build \
            --build-arg=FRAPPE_PATH=https://github.com/frappe/frappe \
            --build-arg=FRAPPE_BRANCH="$BRANCH" \
            --build-arg=CACHE_BUST="${{ github.sha }}" \
            --secret=id=apps_json,src=apps.json \
            --tag="$IMAGE:$BRANCH" \
            --tag="$IMAGE:$BRANCH-${{ github.sha }}" \
            --file=images/layered/Containerfile \
            --push \
            .

      - name: Summary
        env:
          BRANCH: ${{ steps.vars.outputs.branch }}
        run: |
          {
            echo "### Pushed"
            echo "- \`$IMAGE:$BRANCH\` (moving)"
            echo "- \`$IMAGE:$BRANCH-${{ github.sha }}\` (immutable)"
          } >> "$GITHUB_STEP_SUMMARY"

# Interpolated environment values (secrets + cross-referenced config).
#
# Why this file exists (same reason as infisical/compose/secrets.yml and
# gitea/compose/secrets.yml):
#   A service's `env_file:` is NOT interpolated against the include's env_file
#   scope, so any `${VAR}` placed in container-envs/*.env resolves to an empty
#   string. The compose *body* IS interpolated against that scope
#   (interpolation-envs/*.env + /dev/shm/apps_paperless.env), so every value
#   that needs interpolation must be set here as an `environment:` entry.
#
#   container-envs/*.env  -> literal values only
#   this file             -> anything containing ${...}
#
# Merged onto compose/stack.yml via the `path:` list in ../compose.yaml, so
# both share the same env_file interpolation scope.
services:

  db:
    environment:
      POSTGRES_USER: ${PAPERLESS__POSTGRES_USER:?err}
      POSTGRES_PASSWORD: ${PAPERLESS_PG_PASS:?err}
      POSTGRES_DB: ${PAPERLESS__POSTGRES_DBNAME:?err}
  webserver:
    environment:
      # --- Security secret (rendered to /dev/shm/apps_paperless.env) ---
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?err}
      # --- Database (PASS is the secret rendered to /dev/shm/apps_paperless.env) ---
      PAPERLESS_DBUSER: ${PAPERLESS__POSTGRES_USER:?err}
      PAPERLESS_DBNAME: ${PAPERLESS__POSTGRES_DBNAME:?err}
      PAPERLESS_DBPASS: ${PAPERLESS_PG_PASS:?err}

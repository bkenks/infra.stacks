services:
  broker:
    image: docker.io/library/redis:${REDIS__VERS_TAG:?err}
    volumes:
      - redis-data:/data
    env_file:
      - "../container-envs/${REDIS__NAME:?err}.env"
    restart: on-failure:${REDIS__MAX_RESTART_ATTEMPS:?err}
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - '6379'

  db:
    image: docker.io/library/postgres:${POSTGRES__VERS_TAG:?err}
    volumes:
      - pg-data:/var/lib/postgresql
    env_file:
      - "../container-envs/${POSTGRES__NAME:?err}.env"
    restart: on-failure:${POSTGRES__MAX_RESTART_ATTEMPS:?err}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready --username=${PAPERLESS__POSTGRES_USER:?err}" ]
      interval: 5s
      timeout: 10s
      retries: 10
    expose:
      - '5432'

  gotenberg:
    image: docker.io/gotenberg/gotenberg:${GOTENBERG__VERS_TAG:?err}
    # The gotenberg chromium route is used to convert .eml files. We do not
    # want to allow external content like tracking pixels or even javascript.
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    restart: on-failure:${GOTENBERG__MAX_RESTART_ATTEMPS:?err}
    expose:
      - '3000'

  tika:
    image: docker.io/apache/tika:${TIKA__VERS_TAG:?err}
    restart: on-failure:${TIKA__MAX_RESTART_ATTEMPS:?err}
    expose:
      - '9998'
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:${PAPERLESS__VERS_TAG:?err}
    depends_on:
      broker:
        condition: service_healthy
      db:
        condition: service_healthy
      gotenberg:
        condition: service_started
      tika:
        condition: service_started
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - ${DOCKER_VOLUMES}/apps/paperless/export:/usr/src/paperless/export
      - ${DOCKER_VOLUMES}/apps/paperless/consume:/usr/src/paperless/consume
    env_file:
      - "../container-envs/${PAPERLESS__NAME:?err}.env"
    networks:
      - default
      - proxy
    restart: on-failure:${PAPERLESS__MAX_RESTART_ATTEMPS:?err}
    healthcheck:
      test: [ "CMD", "curl", "-fs", "-S", "--max-time", "2", "http://localhost:8000" ]
      interval: 30s
      timeout: 10s
      retries: 5
    # Exposed to Traefik on the shared `proxy` network — no published host port.
    # Paperless listens on its default container port 8000.
    labels:
      traefik.enable: 'true'
      traefik.http.routers.paperless.rule: 'Host(`paper.homektb.com`) || Host(`paper.lilbud.homektb.com`)'
      traefik.http.routers.paperless.entrypoints: websecure
      traefik.http.routers.paperless.tls: 'true'
      traefik.http.services.paperless.loadbalancer.server.port: '8000'
    expose:
      - '8000'

networks:
  # Shared reverse-proxy network, created by Ansible and joined by Traefik.
  # We only attach to it — Traefik must be deployed on this host first.
  proxy:
    external: true
    name: proxy

# Volume names are PINNED to the old project-scoped names (the previous layout
# used `name: paperless-${DOCK_ENV}`, prefixing volumes `paperless-production_`)
# so the existing data is reused regardless of the compose project name Komodo
# assigns. Compose logs a harmless "volume already exists but was not created by
# Docker Compose" warning and uses them as-is.
volumes:
  data:
    name: paperless-production_data
  media:
    name: paperless-production_media
  pg-data:
    name: paperless-production_pg-data
  redis-data:
    name: paperless-production_redis-data

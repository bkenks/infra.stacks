name: paperless
networks:
  default:
    name: paperless
  shared-proxy:
    external: true
    name: shared-proxy
services:
  broker:
    container_name: paperless_broker
    environment:
      ALLOW_EMPTY_PASSWORD: 'yes'
    expose:
    - '6379'

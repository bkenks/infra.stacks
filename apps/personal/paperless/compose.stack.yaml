    - broker:/data
  db:
    container_name: paperless_db
    environment:
      POSTGRES_DB: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_PG_PASS:?err}
      POSTGRES_USER: paperless
    expose:
    - '5432'
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready --username=paperless
      timeout: 10s
    image: docker.io/library/postgres:18
    networks:
      default:
        aliases:
        - paperless_db
    restart: on-failure:5
    volumes:
    - db:/var/lib/postgresql
  gotenberg:
    command:
    - gotenberg
    - --chromium-disable-javascript=true
    - --chromium-allow-list=file:///tmp/.*
    container_name: paperless_gotenberg
    expose:
    - '3000'
    image: docker.io/gotenberg/gotenberg:8.25
    networks:
      default:
        aliases:
        - paperless_gotenberg
    restart: on-failure:5
  tika:
    container_name: paperless_tika
    expose:
    - '9998'
    image: docker.io/apache/tika:latest
    networks:
      default:
        aliases:
        - paperless_tika
    restart: on-failure:5
  webserver:
    container_name: paperless_webserver
    depends_on:
      broker:
        condition: service_healthy
      db:
        condition: service_healthy
      gotenberg:
        condition: service_started
      tika:
        condition: service_started
    environment:
      PAPERLESS_DATE_ORDER: MDY
      PAPERLESS_DBHOST: paperless_db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_PG_PASS:?err}
      PAPERLESS_DBUSER: paperless
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_REDIS: redis://paperless_broker:6379
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?err}
      PAPERLESS_TIKA_ENABLED: '1'
      PAPERLESS_TIKA_ENDPOINT: http://paperless_tika:9998

name: budibase-${DOCK_ENV}

# Self-hosted Budibase (low-code app builder). Bundles its own datastores
# (CouchDB / Minio / Redis) — no shared postgres network needed. Only the
# proxy is published; it fronts the app, worker, couchdb and minio services.
# Reference: https://docs.budibase.com/docs/docker-compose

services:
  app-service:
    image: budibase/apps:3.38.4
    container_name: ${COMPOSE_PROJECT_NAME}-app
    depends_on:
      - couchdb-service
      - minio-service
      - redis-service
      - worker-service
    environment:
      SELF_HOSTED: 1
      PORT: 4002
      LOG_LEVEL: info
      ENABLE_ANALYTICS: "false"
      WORKER_URL: http://worker-service:4003
      MINIO_URL: http://minio-service:9000
      REDIS_URL: redis-service:6379
    env_file:
      - envs/production.env
    restart: unless-stopped

  couchdb-service:
    image: budibase/database:2.1.0
    container_name: ${COMPOSE_PROJECT_NAME}-couchdb
    volumes:
      - ${DOCKER_VOLUMES}/apps/budibase/couchdb:/data
    environment:
      TARGETBUILD: docker-compose
      DATA_DIR: /data
    env_file:
      - envs/production.env
    restart: unless-stopped

  minio-service:
    image: minio/minio
    container_name: ${COMPOSE_PROJECT_NAME}-minio
    volumes:
      - ${DOCKER_VOLUMES}/apps/budibase/minio:/data
    environment:
      MINIO_BROWSER: "off"
    env_file:
      - envs/production.env
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: "timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"
      interval: 30s
      timeout: 20s
      retries: 3

  proxy-service:
    image: budibase/proxy:3.38.4
    container_name: ${COMPOSE_PROJECT_NAME}-proxy
    depends_on:
      - app-service
      - couchdb-service
      - minio-service
      - worker-service
    environment:
      PROXY_RATE_LIMIT_WEBHOOKS_PER_SECOND: 10
      PROXY_RATE_LIMIT_API_PER_SECOND: 50
      APPS_UPSTREAM_URL: http://app-service:4002
      WORKER_UPSTREAM_URL: http://worker-service:4003
      MINIO_UPSTREAM_URL: http://minio-service:9000
      COUCHDB_UPSTREAM_URL: http://couchdb-service:5984
      RESOLVER: 127.0.0.11
    ports:
      - '10000:10000'
    restart: unless-stopped

  redis-service:
    image: redis:7.4
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    volumes:
      - ${DOCKER_VOLUMES}/apps/budibase/redis:/data
    env_file:
      - envs/production.env
    command: [ "sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\"" ]
    restart: unless-stopped

  worker-service:
    image: budibase/worker:3.38.4
    container_name: ${COMPOSE_PROJECT_NAME}-worker
    depends_on:
      - couchdb-service
      - minio-service
      - redis-service
    environment:
      SELF_HOSTED: 1
      PORT: 4003
      CLUSTER_PORT: 10000
      APPS_URL: http://app-service:4002
      MINIO_URL: http://minio-service:9000
      REDIS_URL: redis-service:6379
    env_file:
      - envs/production.env
    restart: unless-stopped

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}-net

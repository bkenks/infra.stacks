forgejo:
  db:
    environment:
      POSTGRES_DB: "forgejo"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?err}"
      POSTGRES_USER: "forgejo"
  server:
    environment:
      FORGEJO____APP_NAME: "Forgejo"
      FORGEJO__database__DB_TYPE: "postgres"
      FORGEJO__database__HOST: "db:5432"
      FORGEJO__database__NAME: "forgejo"
      FORGEJO__database__PASSWD: "${DB_PASSWORD:?err}"
      FORGEJO__database__USER: "forgejo"
      USER_GID: "1000"
      USER_UID: "1000"

woodpecker:
  agent:
    environment:
      WOODPECKER_AGENT_SECRET: "${WOODPECKER_AGENT_SECRET:?err}"
      WOODPECKER_BACKEND_DOCKER_LIMIT_CPU_QUOTA: "200000"
      WOODPECKER_BACKEND_DOCKER_LIMIT_MEM: "4294967296"
      WOODPECKER_BACKEND_DOCKER_LIMIT_MEM_SWAP: "4294967296"
      WOODPECKER_MAX_WORKFLOWS: "2"
      WOODPECKER_SERVER: "server:9000"
server:
  environment:
    WOODPECKER_AGENT_SECRET: "${WOODPECKER_AGENT_SECRET:?err}"
    WOODPECKER_FORGEJO: "true"
    WOODPECKER_FORGEJO_CLIENT: "${WOODPECKER_FORGEJO_CLIENT:?err}"
    WOODPECKER_FORGEJO_SECRET: "${WOODPECKER_FORGEJO_SECRET:?err}"
    WOODPECKER_FORGEJO_URL: "https://fj.ktbcloud.com"
    WOODPECKER_HOST: "https://peck.ktbcloud.com"
    WOODPECKER_OPEN: "true"
    WOODPECKER_PLUGINS_PRIVILEGED: "woodpeckerci/plugin-docker-buildx:6.1.0"

komodo-mcp:
  app:
    environment:
      KOMODO_API_KEY: "${KOMODO_API_KEY:?err}"
      KOMODO_API_SECRET: "${KOMODO_API_SECRET:?err}"
      KOMODO_URL: "${HTTP_SCHEME:?must enter http scheme}://${KOMODO_FQDN:?must enter FQDN for Komodo}"
      MCP_ALLOWED_HOSTS: "komodo-mcp.ktbinternal.com"
      MCP_TRANSPORT: "http"
      MCP_TRUST_PROXY: "1"
      TZ: "America/Chicago"

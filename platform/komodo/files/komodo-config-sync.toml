name = "ktbgroup-self-hosted"
template = true
[repo.config]
git_account = "bkenks"
repo = "ktbgroup-self-hosted/"

##

[[repo]]
name = "network"
[repo.config]
server = "blueberrypi"
builder = "littlebuddy"
git_account = "bkenks"
repo = "ktbgroup-self-hosted/stack.network"
on_pull.command = """
dcvols -r --uid 1000 --gid 1000
"""

##

[[repo]]
name = "node"
[repo.config]
server = "biggy"
git_account = "bkenks"
repo = "ktbgroup-self-hosted/stack.node"

##

[[repo]]
name = "stackform-hq"
template = true
[repo.config]
git_account = "bkenks"
repo = "stackform-hq/"

##

[[repo]]
name = "stackform_website"
[repo.config]
server = "littlebuddy"
git_provider = "fj.lilbud.homektb.com"
git_account = "bkenks"
repo = "stackform-hq/stackform_website"

##

[[repo]]
name = "stream"
[repo.config]
server = "paiki"
git_account = "bkenks"
repo = "ktbgroup-self-hosted/stack.stream"
environment = """
DOCKER_VOLUMES = [[DOCKER_VOLUMES]]
"""

##

[[procedure]]
name = "Backup Core Database"
description = "Triggers the Core database backup at the scheduled time."
config.schedule = "Every day at 01:00"

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "BackupCoreDatabase", execution.params = {}, enabled = true }
]

##

[[procedure]]
name = "Global Auto Update"
description = "Pulls and auto updates Stacks and Deployments using 'poll_for_updates' or 'auto_update'."
config.schedule = "Every day at 03:00"

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "GlobalAutoUpdate", execution.params.skip_auto_update = false, enabled = true }
]

##

[[procedure]]
name = "Global Cleanup"
config.webhook_enabled = false
config.schedule = "Every Sunday at midnight"
config.schedule_timezone = "America/New_York"

[[procedure.config.stage]]
name = "Pruning"
enabled = true
executions = [
  { execution.type = "PruneSystem", execution.params.server = "littlebuddy", enabled = true },
  { execution.type = "PruneSystem", execution.params.server = "maboi", enabled = true },
  { execution.type = "PruneSystem", execution.params.server = "paiki", enabled = true }
]

##

[[procedure]]
name = "Restart: infisical-agent"
config.webhook_secret = "bing40bong!@"

[[procedure.config.stage]]
name = "Deploy config"
enabled = true
executions = [
  { execution.type = "DeployStack", execution.params.stack = "infisical-agent_littlebuddy", execution.params.services = [], enabled = true },
  { execution.type = "DeployStack", execution.params.stack = "infisical-agent_maboi", execution.params.services = [], enabled = true },
  { execution.type = "DeployStack", execution.params.stack = "infisical-agent_paiki", execution.params.services = [], enabled = true }
]

[[procedure.config.stage]]
name = "Restart container"
enabled = true
executions = [
  { execution.type = "RestartStack", execution.params.stack = "infisical-agent_littlebuddy", execution.params.services = [], enabled = true },
  { execution.type = "RestartStack", execution.params.stack = "infisical-agent_maboi", execution.params.services = [], enabled = true },
  { execution.type = "RestartStack", execution.params.stack = "infisical-agent_paiki", execution.params.services = [], enabled = true }
]

##

[[alerter]]
name = "discord"
[alerter.config]
enabled = true
endpoint.type = "Discord"
endpoint.params.url = "https://discord.com/api/webhooks/1516461642970435736/3uRv5LdQzc5RSkXVfdfxDVVmbxx2odOSdTuBpkSqOq9lzgrNORN9IsWbVSwYpjTpiNVN"

##

[[builder]]
name = "littlebuddy"
[builder.config]
type = "Server"
params.server_id = "littlebuddy"

##

[[resource_sync]]
name = "Global Backup TOML"
[resource_sync.config]
linked_repo = "infra.stacks"
resource_path = [
  "./platform/komodo/files/komodo-config-sync.toml"
]
managed = true
# DRAFT — NOT APPLIED until validated at wire-up time.
# The exact YAML tags (!Find / !KeyOf) and the flow slugs referenced below
# (default-authorization-flow, default-provider-invalidation-flow) MUST be
# validated against the RUNNING Authentik version (2026.5.3) before this
# blueprint is trusted — flow slugs and default object names drift between
# releases. Treat everything here as a starting point, not a finished manifest.
#
# Purpose: a Proxy provider in forward-auth mode + its application + an outpost
# that binds it, so internal apps behind any mesh Traefik can be gated by
# Authentik forward-auth (middleware authentik-forwardauth@file, added by the
# proxyAddAuth mixin). Cookie domain homektb.com covers *.homektb.com in one SSO
# session. Mounted read-only at /blueprints/ktb.
version: 1
metadata:
  name: ktb-internal-forwardauth
  labels:
    blueprints.goauthentik.io/description: "Forward-auth proxy provider + outpost for internal apps"
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: provider-internal-forwardauth
    identifiers:
      name: internal-forwardauth
    attrs:
      name: internal-forwardauth
      mode: forward_single
      # external_host is the app domain Authentik issues the auth cookie for;
      # per-app hosts are added at wire-up. Cookie domain spans *.homektb.com.
      external_host: https://auth.homektb.com
      cookie_domain: homektb.com
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    id: app-internal-forwardauth
    identifiers:
      slug: internal-forwardauth
    attrs:
      name: Internal Forward Auth
      slug: internal-forwardauth
      provider: !KeyOf provider-internal-forwardauth
      policy_engine_mode: any

  # Outpost binding the proxy provider. This is the standalone outpost served by
  # platform/identity/authentik-outpost; its API token is what AUTHENTIK_TOKEN
  # there must hold. authentik_host_browser stays on the public auth URL.
  - model: authentik_outposts.outpost
    id: outpost-internal
    identifiers:
      name: internal-forwardauth-outpost
    attrs:
      name: internal-forwardauth-outpost
      type: proxy
      providers:
        - !KeyOf provider-internal-forwardauth
      config:
        authentik_host: https://auth.ktbcloud.com
        authentik_host_insecure: false
        authentik_host_browser: https://auth.ktbcloud.com

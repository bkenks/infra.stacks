# DRAFT — NOT APPLIED until validated at wire-up time.
# The exact YAML tags (!Find / !KeyOf) and the flow slugs referenced below
# (default-authorization-flow, default-provider-invalidation-flow, and the
# scope-mapping / signing-key lookups) MUST be validated against the RUNNING
# Authentik version (2026.5.3) before this blueprint is trusted — flow slugs and
# default object names drift between releases. Treat everything here as a
# starting point, not a finished manifest.
#
# Purpose: an OAuth2 / OIDC provider + application so Pangolin can use Authentik
# as its identity provider. Mounted read-only at /blueprints/ktb (see the stack's
# compose volumes); Authentik auto-discovers blueprints under /blueprints.
version: 1
metadata:
  name: ktb-pangolin-oidc
  labels:
    blueprints.goauthentik.io/description: "OIDC provider + application for Pangolin SSO"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-pangolin
    identifiers:
      name: pangolin
    attrs:
      name: pangolin
      client_type: confidential
      # client_id / client_secret: leave Authentik to generate, then read them
      # back into Pangolin's OIDC config at wire-up. Do NOT hardcode secrets here.
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # Redirect URIs are validated against Pangolin's callback at wire-up.
      redirect_uris:
        - matching_mode: strict
          url: https://pangolin.homektb.com/api/v1/auth/idp/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    id: app-pangolin
    identifiers:
      slug: pangolin
    attrs:
      name: Pangolin
      slug: pangolin
      provider: !KeyOf provider-pangolin
      meta_launch_url: https://pangolin.homektb.com
      policy_engine_mode: any

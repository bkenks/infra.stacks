# Parent compose — Komodo deploy entrypoint for the traefik stack.
# Hand-written (NOT generated). Includes the jsonnet-rendered service defs and
# declares the interpolation env_file: the shared platform secret file Ansible
# renders (/dev/shm/platform.env — core platform services are bootstrapped, so
# Ansible writes it, not the Infisical agent) — supplies CF_DNS_API_TOKEN.
# Komodo targets THIS file.
name: traefik
include:
  - path: ./compose.stack.yaml
    env_file: /dev/shm/platform.env

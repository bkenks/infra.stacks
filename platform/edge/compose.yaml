# =============================================================================
# Edge — group entrance compose (its own project: `edge`).
# =============================================================================
# Deploys this host's ingress edge as ONE unit (run from THIS dir):
#   cd edge && docker compose up -d
# Each member is also independently deployable from its own dir.
#
# Members: traefik (reverse proxy, OWNS the shared `proxy` net), cloudflared
# (Cloudflare Tunnel ingress -> Traefik). Deploy edge before anything that needs
# to be routed; traefik must create `proxy` first.
#
# Required deploy vars (per host, at deploy time — see .env / Ansible / Komodo):
#   ROOT_DOMAIN_NAME      base domain for routing/TLS (e.g. homektb.com)
#   CF_DNS_API_TOKEN      Cloudflare DNS-01 ACME token (rendered to /dev/shm)
#   CLOUDFLARE_TUNNEL_TOKEN   tunnel creds (rendered to /dev/shm)
name: edge

include:
  - ./traefik/compose.yaml
  - ./cloudflared/compose.yaml

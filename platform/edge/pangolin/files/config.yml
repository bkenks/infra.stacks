# To see all available options, please visit the docs:
# https://docs.pangolin.net/

gerbil:
    start_port: 51820
    base_endpoint: "pangolin.ktbinternal.com"

app:
    dashboard_url: "https://pangolin.ktbinternal.com"
    log_level: "info"
    telemetry:
        anonymous_usage: true

domains:
    domain1:
        base_domain: "ktbinternal.com"
    # External / public plane. Authentik (auth.ktbcloud.com) and every public
    # *.ktbcloud.com Resource live under this zone. Registering it here lets
    # Pangolin create Resources under ktbcloud.com; the wildcard TLS cert for it
    # is requested once by the raw authentik-router in dynamic_config.yml.
    domain2:
        base_domain: "ktbcloud.com"

server:
    # secret supplied via the SERVER_SECRET env var (infisical-agent). Must be
    # OMITTED here, not blanked — Pangolin's config loader only applies the
    # env override when the key is absent; `secret: ""` counts as "defined"
    # and fails validation (>=8 chars) before the env var is ever consulted.
    cors:
        origins: ["https://pangolin.ktbinternal.com"]
        methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
        allowed_headers: ["X-CSRF-Token", "Content-Type"]
        credentials: false
    maxmind_db_path: "./config/GeoLite2-Country.mmdb"
    maxmind_asn_path: "./config/GeoLite2-ASN.mmdb"

email:
    smtp_host: "smtp.resend.com"
    smtp_port: 465
    smtp_user: "resend"
    # smtp_pass supplied via the EMAIL_SMTP_PASS env var (infisical-agent) —
    # must be OMITTED here for the same reason as server.secret above.
    no_reply: "pangolin@notify.ktbinternal.com"

flags:
    require_email_verification: true
    disable_signup_without_invite: true
    disable_user_create_org: false
    allow_raw_resources: true

http:
  middlewares:
    badger:
      plugin:
        badger:
          disableForwardAuth: true
    redirect-to-https:
      redirectScheme:
        scheme: https

  routers:
    # HTTP to HTTPS redirect router
    main-app-router-redirect:
      rule: "Host(`pangolin.ktbinternal.com`)"
      service: next-service
      entryPoints:
        - web
      middlewares:
        - redirect-to-https
        - badger

    # Next.js router (handles everything except API and WebSocket paths).
    # Requests the *.ktbinternal.com wildcard here (once) via Cloudflare DNS-01 —
    # same "request once, serve everywhere via SNI" trick as this repo's
    # platform/edge/traefik files/host.yml. Every other router (this stack's
    # api-router/ws-router, and any router Pangolin itself adds dynamically
    # for a new Resource under ktbinternal.com) then just needs `tls: true` /
    # `certResolver: cloudflare` with no domains block of its own.
    next-router:
      rule: "Host(`pangolin.ktbinternal.com`) && !PathPrefix(`/api/v1`)"
      service: next-service
      entryPoints:
        - websecure
      middlewares:
        - badger
      tls:
        certResolver: cloudflare
        domains:
          - main: ktbinternal.com
            sans:
              - "*.ktbinternal.com"

    # API router (handles /api/v1 paths)
    api-router:
      rule: "Host(`pangolin.ktbinternal.com`) && PathPrefix(`/api/v1`)"
      service: api-service
      entryPoints:
        - websecure
      middlewares:
        - badger
      tls:
        certResolver: cloudflare

    # WebSocket router
    ws-router:
      rule: "Host(`pangolin.ktbinternal.com`)"
      service: api-service
      entryPoints:
        - websecure
      middlewares:
        - badger
      tls:
        certResolver: cloudflare

    # Authentik IdP — the ONE public entrypoint on the ktbcloud.com plane.
    # RAW router: no badger, no SSO/forward-auth middleware. Authentik must be
    # reachable with its own login (putting badger/SSO in front produces a login
    # loop, and Authentik is break-glass — never behind itself). Reaches
    # authentik_server over the shared-edge network (gerbil joins it in
    # compose.stack.jsonnet; Traefik shares gerbil's netns).
    #
    # This router also carries the ktbcloud.com wildcard cert request — the same
    # "request the wildcard once via DNS-01, serve everywhere via SNI" trick as
    # next-router does for ktbinternal.com. Every future *.ktbcloud.com Resource
    # Pangolin adds dynamically then just needs certResolver with no domains
    # block. (Requires CF_DNS_API_TOKEN widened to the ktbcloud.com zone.)
    authentik-router:
      rule: "Host(`auth.ktbcloud.com`)"
      service: authentik-service
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
        domains:
          - main: ktbcloud.com
            sans:
              - "*.ktbcloud.com"

  services:
    next-service:
      loadBalancer:
        servers:
          - url: "http://pangolin:3002"  # Next.js server

    api-service:
      loadBalancer:
        servers:
          - url: "http://pangolin:3000"  # API/WebSocket server

    authentik-service:
      loadBalancer:
        servers:
          # Resolves over shared-edge; authentik_server publishes :9000 (HTTP).
          - url: "http://authentik_server:9000"

tcp:
  serversTransports:
    pp-transport-v1:
      proxyProtocol:
        version: 1
    pp-transport-v2:
      proxyProtocol:
        version: 2

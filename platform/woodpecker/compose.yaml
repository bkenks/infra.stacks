include:
  - path:
      - ./compose/stack.yml
      - ./compose/secrets.yml
    env_file:
      - ./interpolation-envs/general.env
      - ./interpolation-envs/production.env
      # Secrets rendered (RAM) by the infisical-agent on this same host.
      # Must exist before `up`: the infisical stack (agent) runs first.
      - /dev/shm/woodpecker.env

services:
  server: {}
  agent: {}

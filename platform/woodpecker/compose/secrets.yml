# Interpolated environment values (secrets + cross-referenced config).
#
# Why this file exists (same reason as gitea/compose/secrets.yml):
#   A service's `env_file:` is NOT interpolated against the include's env_file
#   scope, so any `${VAR}` placed in container-envs/*.env resolves to an empty
#   string. The compose *body* IS interpolated against that scope
#   (interpolation-envs/*.env + /dev/shm/woodpecker.env), so every value that
#   needs interpolation must be set here as an `environment:` entry.
#
#   container-envs/*.env  -> literal values only
#   this file             -> anything containing ${...}
#
# Merged onto compose/stack.yml via the `path:` list in ../compose.yaml,
# so both share the same env_file interpolation scope.
#
# All three secrets below are rendered to /dev/shm/woodpecker.env by the
# Infisical agent (Infisical folder `/woodpecker`):
#   WOODPECKER_FORGEJO_CLIENT / WOODPECKER_FORGEJO_SECRET — the OAuth2 app
#     registered in Forgejo (https://fj.lilbud.homektb.com/user/settings/applications).
#   WOODPECKER_AGENT_SECRET — shared server<->agent gRPC auth secret
#     (generate with `openssl rand -hex 32`); MUST match on both services.
services:
  server:
    environment:
      WOODPECKER_FORGEJO_CLIENT: ${WOODPECKER_FORGEJO_CLIENT:?err}
      WOODPECKER_FORGEJO_SECRET: ${WOODPECKER_FORGEJO_SECRET:?err}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:?err}

  agent:
    environment:
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:?err}

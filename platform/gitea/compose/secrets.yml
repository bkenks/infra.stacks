# Interpolated environment values (secrets + cross-referenced config).
#
# Why this file exists (same reason as infisical/compose/secrets.yml):
#   A service's `env_file:` is NOT interpolated against the include's env_file
#   scope, so any `${VAR}` placed in container-envs/*.env resolves to an empty
#   string. The compose *body* IS interpolated against that scope
#   (interpolation-envs/*.env + /dev/shm/gitea.env), so every value that needs
#   interpolation must be set here as an `environment:` entry.
#
#   container-envs/*.env  -> literal values only
#   this file             -> anything containing ${...}
#
# Merged onto compose/stack.yml via the `path:` list in ../compose.yaml,
# so both share the same env_file interpolation scope.
services:
  app:
    environment:
      # --- Database (PASSWD is the secret rendered to /dev/shm/gitea.env) ---
      GITEA__database__NAME: ${GITEA__POSTGRES_DBNAME:?err}
      GITEA__database__USER: ${GITEA__POSTGRES_USER:?err}
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD:?err}
      # --- Security secrets — DISABLED by default ------------------------------
      # On a FRESH install Gitea auto-generates SECRET_KEY / INTERNAL_TOKEN /
      # JWT_SECRET and persists them in app.ini (in the gitea-data volume), so we
      # don't supply them. Leave these commented for normal deploys.
      #
      # RE-ENABLE ONLY WHEN RESTORING an existing gitea: uncomment these AND the
      # matching lines in infisical/files/agent-config.yaml, and store the
      # ORIGINAL values (the ones from the old app.ini) in Infisical under
      # /gitea. This pins the SECRET_KEY so previously-encrypted data (2FA,
      # stored mirror/login creds) stays decryptable. A mismatched value here
      # would BREAK that data — so only set values you know are correct.
      # GITEA__security__SECRET_KEY: ${GITEA_SECRET_KEY:?err}
      # GITEA__security__INTERNAL_TOKEN: ${GITEA_INTERNAL_TOKEN:?err}
      # GITEA__oauth2__JWT_SECRET: ${GITEA_JWT_SECRET:?err}

  db:
    environment:
      POSTGRES_USER: ${GITEA__POSTGRES_USER:?err}
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD:?err}
      POSTGRES_DB: ${GITEA__POSTGRES_DBNAME:?err}
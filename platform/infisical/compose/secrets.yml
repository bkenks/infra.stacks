# Interpolated environment values (secrets + cross-referenced config).
#
# Why this file exists:
#   A service's `env_file:` is NOT interpolated against the include's
#   `env_file:` scope, so any `${VAR}` placed in container-envs/*.env resolves
#   to an empty string. The compose *body* IS interpolated against that scope
#   (interpolation-envs/*.env + /dev/shm/infisical-bootstrap.env), so every
#   value that needs interpolation must be set here as an `environment:` entry.
#
#   container-envs/*.env  -> literal values only
#   this file             -> anything containing ${...}
#
# This file is merged onto compose/stack.yml via the `path:` list in
# ../compose.yaml, so both share the same env_file interpolation scope.
services:
  app:
    environment:
      # --- Core secrets (rendered to /dev/shm by the Infisical agent) ---
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:?err}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET:?err}

      # --- Database ---
      DB_CONNECTION_URI: postgres://${INFISICAL__POSTGRES_USER:?err}:${INFISICAL_DB_PASSWORD:?err}@db:5432/${INFISICAL__POSTGRES_DBNAME:?err}

      # --- Site ---
      SITE_URL: ${INFISICAL__SITE_URL:?err}

      # --- SMTP (optional; leave blank to disable email) ---
      SMTP_HOST: ${INFISICAL__SMTP_HOST:-}
      SMTP_PORT: ${INFISICAL__SMTP_PORT:-}
      SMTP_FROM_ADDRESS: ${INFISICAL__SMTP_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${INFISICAL__SMTP_FROM_NAME:-}
      SMTP_USERNAME: ${INFISICAL__SMTP_USERNAME:-}
      SMTP_PASSWORD: ${INFISICAL_SMTP_PASSWORD:-}

  db:
    environment:
      POSTGRES_USER: ${INFISICAL__POSTGRES_USER:?err}
      POSTGRES_PASSWORD: ${INFISICAL_DB_PASSWORD:?err}
      POSTGRES_DB: ${INFISICAL__POSTGRES_DBNAME:?err}

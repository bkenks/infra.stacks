[[procedure]]
name = "Backup Core Database"
description = "Triggers the Core database backup at the scheduled time."
config.schedule_enabled = false
config.schedule = "Every day at 01:00"

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "BackupCoreDatabase", execution.params = {}, enabled = true }
]

##

[[procedure]]
name = "Global Auto Update"
description = "Pulls and auto updates Stacks and Deployments using 'poll_for_updates' or 'auto_update'."
config.schedule_enabled = false
config.schedule = "Every day at 03:00"

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "GlobalAutoUpdate", execution.params.skip_auto_update = false, enabled = true }
]

##

[[procedure]]
name = "Maintainence"
description = "Ran every night. Cleans up docker resources, syncs configuration with TOML file, backs up the database, and updates images."
config.webhook_enabled = false
config.schedule = "Every day at 11:00 pm"
config.schedule_timezone = "America/New_York"

[[procedure.config.stage]]
name = "Prune Containers"
enabled = true
executions = [
  { execution.type = "PruneContainers", execution.params.server = "biggy", enabled = true },
  { execution.type = "PruneContainers", execution.params.server = "bill", enabled = true },
  { execution.type = "PruneContainers", execution.params.server = "littlebuddy", enabled = true },
  { execution.type = "PruneContainers", execution.params.server = "maboi", enabled = true },
  { execution.type = "PruneContainers", execution.params.server = "paiki", enabled = true }
]

[[procedure.config.stage]]
name = "Prune Networks"
enabled = true
executions = [
  { execution.type = "PruneNetworks", execution.params.server = "biggy", enabled = true },
  { execution.type = "PruneNetworks", execution.params.server = "bill", enabled = true },
  { execution.type = "PruneNetworks", execution.params.server = "littlebuddy", enabled = true },
  { execution.type = "PruneNetworks", execution.params.server = "maboi", enabled = true },
  { execution.type = "PruneNetworks", execution.params.server = "paiki", enabled = true }
]

[[procedure.config.stage]]
name = "Prune Images"
enabled = true
executions = [
  { execution.type = "PruneImages", execution.params.server = "biggy", enabled = true },
  { execution.type = "PruneImages", execution.params.server = "bill", enabled = true },
  { execution.type = "PruneImages", execution.params.server = "littlebuddy", enabled = true },
  { execution.type = "PruneImages", execution.params.server = "maboi", enabled = true },
  { execution.type = "PruneImages", execution.params.server = "paiki", enabled = true }
]

[[procedure.config.stage]]
name = "Sync TOML"
enabled = true
executions = [
  { execution.type = "CommitSync", execution.params.sync = "Global TOML Sync", enabled = true }
]

[[procedure.config.stage]]
name = "Backup DB"
enabled = true
executions = [
  { execution.type = "BackupCoreDatabase", execution.params = {}, enabled = true }
]

[[procedure.config.stage]]
name = "Poll For Updates"
enabled = true
executions = [
  { execution.type = "GlobalAutoUpdate", execution.params.skip_auto_update = false, enabled = true }
]

##

[[procedure]]
name = "Redeploy Infisical Agent"

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "BatchDeployStack", execution.params.pattern = "infisical-agent*", enabled = true }
]

##

[[procedure]]
name = "Redeploy Traefik"

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [

[[stack]]
name = "infisical-agent_bill"
tags = ["secret-agent"]
[stack.config]
server = "bill"
poll_for_updates = true
destroy_before_deploy = true
linked_repo = "infra.stacks"
webhook_enabled = false
run_directory = "./platform/secrets-manager/infisical-agent"
config_files = [
  { path = "README.md" },
  { path = "compose.stack.yaml" }
]
environment = """

AGENT_HOST              = 'bill'                                # e.g. 'littlebuddy' or 'paiki' | This host. Must match folder in Infisical project
AGENT_SERVICES          = 'cloudflare__dns-api-token frappe'
# INFISICAL_ADDRESS     = 'http://infisical_app:8080'           # Uncomment if Infisical runs on this host
INFISICAL_CLIENT_ID     = [[INFSCL_AGNT_CLIENT_ID__BILL]]       # Set in Komodo variables (toggle secret on to prevent upload to Repo)
INFISICAL_CLIENT_SECRET = [[INFSCL_AGNT_CLIENT_SECRET__BILL]]   # Set in Komodo variables (toggle secret on to prevent upload to Repo)
"""


---
services:
  mongo-db:
    image: mongo:8.2.4
    container_name: mongo-db
    volumes:
      - ${DOCKER_VOLUMES}/dcm/mongo/data:/data/db
      - ${DOCKER_VOLUMES}/dcm/mongo/config:/data/configdb
    env_file:
      - ../container-envs/core.env
      # MONGO_INITDB_ROOT_USERNAME/PASSWORD from the Infisical agent's render.
      # Optional — not present at first container start; rendered by the Infisical agent.
      - path: /dev/shm/komodo.env
        required: false
    ports:
      - '27017:27017'
    command: --quiet --wiredTigerCacheSizeGB 0.25
    restart: unless-stopped
    networks:
      komodo:
        aliases:
          - ${SERVICE_NAME}-mongo
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers

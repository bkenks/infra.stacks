name: komodo

include:
  - path:
      - ./compose/core.yaml # Komodo Core - the UI
      - ./compose/mongo.yaml # Komodo Database - configuration storage
    env_file:
      - ./interpolation-envs/general.env

services:
  komodo-core:
    depends_on:
      - mongo-db

volumes:
  # Distinct from komodo-periphery's keys volume — both would otherwise merge to
  # one volume in the unified project and cross-contaminate PKI.
  komodo-keys:
    name: komodo-keys

networks:
  # This stack's internal network (Core <-> mongo-db). Uniquely keyed so the
  # stack is collision-free standalone and when fused under the platform launcher.
  komodo:
    name: komodo
  # Shared reverse-proxy network OWNED/created by the traefik stack. We only
  # join it here (komodo-core), so the traefik stack must be deployed first.
  proxy:
    external: true
    name: proxy

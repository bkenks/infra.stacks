# Parent compose — Komodo deploy entrypoint for the databasus stack.
# Hand-written (NOT generated). Includes the jsonnet-rendered service defs.
# No interpolation env_file: databasus has no ${...} secrets — its secret is a
# raw .key file bind-mounted from /dev/shm. Komodo targets THIS file.
name: databasus
include:
  - ./compose.stack.yaml

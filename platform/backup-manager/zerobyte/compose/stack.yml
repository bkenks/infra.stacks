---
services:
  zerobyte:
    image: ghcr.io/nicotsx/zerobyte:${ZEROBYTE__VERS_TAG:?err}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - zerobyte-data:/var/lib/zerobyte
      - /var/lib/docker/volumes:/source/docker-volumes
    env_file:
      # Literal, non-secret config (TZ). Basename selected by ZEROBYTE__NAME so
      # the file is named after the software (container-envs/zerobyte.env).
      - "../container-envs/${ZEROBYTE__NAME:?err}.env"
    # Accessed directly by host / Tailscale IP — no Traefik. Web UI on ZEROBYTE__PORT.
    ports:
      - '${ZEROBYTE__PORT:?err}:${ZEROBYTE__PORT:?err}'
    restart: on-failure:${ZEROBYTE__MAX_RESTART_ATTEMPS:?err}
    # Remote-mount support: zerobyte uses FUSE/rclone to mount remote backup
    # backends (S3, B2, SFTP, …). Drop cap_add + devices for a reduced-privilege,
    # local-directory-only deployment (see setup.md).
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    # Aliased on the default bridge so it is addressable by a definitive,
    # project-independent name (SERVICE_NAME), not just the compose service key.
    networks:
      default:
        aliases:
          - ${SERVICE_NAME}

volumes:
  # Explicit global name (project-independent) for zerobyte's config + DB.
  zerobyte-data:
    name: zerobyte

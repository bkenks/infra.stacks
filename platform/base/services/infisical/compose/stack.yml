services:
  infisical-app:
    image: docker.io/infisical/infisical:${INFISICAL__VERS_TAG:?err}
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_healthy
    env_file:
      - "../container-envs/${INFISICAL__NAME:?err}.env"
    restart: on-failure:${INFISICAL__MAX_RESTART_ATTEMPS:?err}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/status" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    expose:
      - '8080'
    # `infisical` (this stack's internal net) keeps app talking to db/redis;
    # `proxy` exposes it to Traefik AND gives it a stable alias the agent can
    # reach directly over the proxy network during a cold bootstrap (before
    # Traefik / the public URL exist).
    networks:
      infisical: {}
      proxy:
        aliases:
          - infisical-app
    labels:
      traefik.enable: 'true'
      traefik.http.routers.infisical.rule: 'Host(`infisical.homektb.com`)'
      traefik.http.routers.infisical.entrypoints: websecure
      traefik.http.routers.infisical.tls: 'true'
      traefik.http.services.infisical.loadbalancer.server.port: '8080'

  infisical-db:
    image: docker.io/library/postgres:${POSTGRES__VERS_TAG:?err}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - "../container-envs/${POSTGRES__NAME:?err}.env"
    restart: on-failure:${POSTGRES__MAX_RESTART_ATTEMPS:?err}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready --username=${INFISICAL__POSTGRES_USER:?err}" ]
      interval: 5s
      timeout: 10s
      retries: 10
    expose:
      - '5432'
    networks:
      - infisical

  infisical-redis:
    image: docker.io/library/redis:${REDIS__VERS_TAG:?err}
    volumes:
      - redis-data:/data
    env_file:
      - "../container-envs/${REDIS__NAME:?err}.env"
    restart: on-failure:${REDIS__MAX_RESTART_ATTEMPS:?err}
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - '6379'
    networks:
      - infisical

networks:
  # This stack's internal network (app <-> db <-> redis). Uniquely keyed so the
  # stack is collision-free both standalone and when fused under the platform
  # launcher.
  infisical:
    name: infisical
  # Shared reverse-proxy network, OWNED/created by the traefik stack. We just
  # join it here — so the traefik stack must be deployed before this one.
  proxy:
    external: true
    name: proxy

volumes:
  # Explicit global names (not project-prefixed) so the data is stable across
  # project renames and unique within the unified platform-base project.
  postgres-data:
    name: infisical-db
  redis-data:
    name: infisical-redis

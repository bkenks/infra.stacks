---
services:
  komodo-core:
    profiles: [ "control-plane" ]
    image: ghcr.io/moghtech/komodo-core:${KOMO_VERS}
    container_name: komodo-core
    volumes:
      - komodo-keys:/config/keys # Store auto-generated PKI keys for v2 authentication
      - ${DOCKER_VOLUMES}/dcm/komodo/data/backups:/backups # Store dated backups of the database - https://komo.do/docs/setup/backup
      - ${DOCKER_VOLUMES}/dcm/komodo/data/syncs:/syncs # Store sync files on server
    env_file:
      - ../container-envs/core.env
      # Secrets rendered by the Infisical agent to /dev/shm/komodo.env:
      # KOMODO_DATABASE_USERNAME/PASSWORD, KOMODO_WEBHOOK_SECRET, KOMODO_JWT_SECRET.
      # Optional — not present at first container start; rendered by the Infisical agent.
      - path: /dev/shm/komodo.env
        required: false
    environment:
      # Non-secret. Public URL behind Traefik; used for OAuth / webhook URL suggestion.
      KOMODO_HOST: https://komo.${ROOT_DOMAIN_NAME}
    ports:
      - '9120:9120'
    extra_hosts:
      - host.docker.internal:host-gateway ## Allows for systemd Periphery connection at "https://host.docker.internal:8120"
    restart: unless-stopped
    # `default` keeps Core talking to mongo-db/periphery; `proxy` exposes the UI
    # to this host's Traefik (stack.node/traefik). 9120 stays published below as
    # a recovery fallback — Komodo manages Traefik, so don't lock yourself out.
    networks:
      - default
      - proxy
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
      # --- Exposed at komo.homektb.com via Traefik (wildcard *.homektb.com cert) ---
      traefik.enable: 'true'
      traefik.http.routers.komodo.rule: 'Host(`komo.homektb.com`)'
      traefik.http.routers.komodo.entrypoints: websecure
      traefik.http.routers.komodo.tls: 'true'
      traefik.http.services.komodo.loadbalancer.server.port: '9120'
    init: true

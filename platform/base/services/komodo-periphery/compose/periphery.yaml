---
services:
  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:${KOMO_VERS}
    container_name: komodo-periphery
    volumes:
      - periphery-keys:/config/keys # Auto-generated PKI keys for v2 authentication
      - /var/run/docker.sock:/var/run/docker.sock # Manage this host's containers
      - /proc:/proc # See host processes from inside the container
      - /etc/komodo:/etc/komodo # Periphery agent root (same path inside and outside the container)
      - ${DOCKER_VOLUMES}:${DOCKER_VOLUMES} # Mirror docker volumes for directory pre-creation
      - /dev/shm/:/dev/shm/
      ## https://komo.do/docs/connect-servers#configuration
    env_file:
      - ../container-envs/periphery.env
    ports:
      - '8120:8120'
    restart: unless-stopped
    labels:
      komodo.skip: # Prevent Komodo from stopping the agent on StopAllContainers
    init: true

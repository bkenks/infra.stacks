# =============================================================================
# Infisical Agent — renders each host's stack secrets to /dev/shm (RAM).
# =============================================================================
# Long-running on EVERY host. What it renders is driven by AGENT_SERVICES (see
# files/services.tab); how it reaches Infisical is one of two compose profiles:
#
#   control-plane  internal address (http://infisical-app:8080), joins `proxy` —
#                  for the host that runs Infisical itself.
#   node           public address (https://infisical.homektb.com) — every other host.
#
# Each host should have its OWN machine identity, scoped in Infisical to only the
# folders of the services in its AGENT_SERVICES. See compose/agent.yml + README.
include:
  - path:
      - ./compose/agent.yml
    env_file:
      - ./interpolation-envs/general.env

name: traefik

include:
  - path:
      - ./compose/stack.yml
    env_file:
      - ./interpolation-envs/general.env
      - ./interpolation-envs/production.env
      # CF_DNS_API_TOKEN for the Cloudflare DNS-01 ACME challenge. Lives in host
      # RAM, read from inside komodo-periphery (where Komodo runs compose). Must
      # exist before deploy. Brought into the container env via stack.yml's
      # `environment:` mapping (include env_file = interpolation scope only).
      - /dev/shm/node_traefik.env

services:
  traefik: {}

# =============================================================================
# platform/base — convenience launcher for the per-host platform services.
# =============================================================================
# Each service under ./services/<svc>/ is a SELF-CONTAINED, independently
# deployable compose project (its own `name:`, its own internal network, joining
# the shared external nets — proxy / db-backups — for anything cross-service).
# Deploy or redeploy any one on its own:
#
#   docker compose -f services/traefik/compose.yaml up -d
#
# This top-level file just `include:`s them all so a single `docker compose up`
# here brings the whole platform up together (as one fused `platform-base`
# project) for local/dev convenience. It carries NO modes, NO profiles, NO gates
# — "which services run on a host" is a deploy-time choice (which stacks you
# point at the host), handled by Komodo / infra.ansible, not baked in here.
#
# Bootstrap ordering still matters (the Infisical agent must render the tier-0
# /dev/shm/*.env files before the services that read ${VAR:?err} at parse time,
# and traefik owns the shared `proxy` net). That ordering lives in the deploy
# layer (infra.ansible / a Komodo procedure), not in this file.
name: platform-base

include:
  - ./services/databasus/compose.yaml
  - ./services/zerobyte/compose.yaml
  - ./services/infisical/compose.yaml
  - ./services/infisical-agent/compose.yaml
  - ./services/traefik/compose.yaml
  - ./services/cloudflared/compose.yaml
  - ./services/komodo-periphery/compose.yaml
  - ./services/komodo/compose.yaml

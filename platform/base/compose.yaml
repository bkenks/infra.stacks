# =============================================================================
# platform/base — PURPOSE-level orchestrator for the control-plane host.
# =============================================================================
# Three levels, each independently deployable:
#   service  ./<group>/<svc>/compose.yaml   one service, its own project
#   group    ./<group>/compose.yaml         a functional unit, its own project
#   purpose  THIS file (project `platform-base`)  the whole platform, phased
#
# The group + service composes are PROFILE-FREE, so they deploy standalone with
# no flags. This file is the ONLY place that gates deploy order — it layers
# cumulative PHASE profiles onto each service by name (so the lower levels stay
# clean). The phase map below is also the deploy-order documentation.
#
# It `include:`s the SERVICE composes directly (one include level), NOT the group
# entrance composes. Why: a service compose's interpolation `env_file` only
# resolves correctly one include level deep — going purpose -> group -> service
# (two levels) breaks that path. The groups stay real, standalone-deployable
# units (deploy a group from its own dir); this file just composes the same
# services directly, which is exactly where the phase map already lives.
#
#   COMPOSE_PROFILES=phase1 docker compose up -d   # backup-manager
#   COMPOSE_PROFILES=phase2 docker compose up -d   # + secrets-manager
#   COMPOSE_PROFILES=phase3 docker compose up -d   # + edge
#   COMPOSE_PROFILES=phase4 docker compose up -d   # + container-manager (all)
#
# Gates (operator pauses) sit BETWEEN phases — driven by Ansible, or by hand:
#   phase1 -> [restore gate: restore the Infisical DB volume] -> phase2
#   phase2 -> [identity gate: create the agent machine-identity; the agent then
#             renders /dev/shm/*.env — wait for them] -> phase3 -> phase4
name: platform-base

include:
  # phase 1 — backup-manager
  - ./backup-manager/databasus/compose.yaml
  - ./backup-manager/zerobyte/compose.yaml
  # phase 2 — secrets-manager
  - ./secrets-manager/infisical/compose.yaml
  - ./secrets-manager/infisical-agent/compose.yaml
  # phase 3 — edge
  - ./edge/traefik/compose.yaml
  - ./edge/cloudflared/compose.yaml
  # phase 4 — container-manager
  - ./container-manager/komodo/compose.yaml
  - ./container-manager/komodo-periphery/compose.yaml

# Phase gating — profiles live ONLY here. Cumulative: phaseN runs all earlier
# phases too. Adding `profiles:` to an included service (by name) is the one
# coupling this layer introduces; the group/service composes have none.
#
# Phase map (the include: list above is in deploy order; this block is kept
# alphabetical for the linter — the phase is encoded in each service's profiles):
#   phase1  backup-manager      databasus, zerobyte
#   phase2  + secrets-manager   infisical-app/-db/-redis, agent
#   phase3  + edge              traefik, cloudflared
#   phase4  + container-manager komodo-core, mongo-db, komodo-periphery
services:
  agent: { profiles: [phase2, phase3, phase4] }
  cloudflared: { profiles: [phase3, phase4] }
  databasus: { profiles: [phase1, phase2, phase3, phase4] }
  infisical-app: { profiles: [phase2, phase3, phase4] }
  infisical-db: { profiles: [phase2, phase3, phase4] }
  infisical-redis: { profiles: [phase2, phase3, phase4] }
  komodo-core: { profiles: [phase4] }
  komodo-periphery: { profiles: [phase4] }
  mongo-db: { profiles: [phase4] }
  traefik: { profiles: [phase3, phase4] }
  zerobyte: { profiles: [phase1, phase2, phase3, phase4] }

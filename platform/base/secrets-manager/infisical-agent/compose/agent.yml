# Infisical Agent — long-running secret renderer, deployed to EVERY host.
#
# ONE service. How it reaches Infisical is just an env var (INFISICAL_ADDRESS),
# set per-host — no compose profiles. What each host renders is driven by
# AGENT_SERVICES (see files/services.tab), not a per-host file.
#
#   default (every node)   INFISICAL_ADDRESS = public https://infisical.homektb.com.
#   the Infisical host      override INFISICAL_ADDRESS = http://infisical-app:8080
#                           (internal — reachable over `proxy` before Traefik /
#                           the public URL exist during a cold bootstrap).
#
# The agent always joins `proxy` (harmless on a plain node; required on the
# Infisical host so it can reach infisical-app directly).
#
# Per-host runtime vars (Komodo per-server variables / Ansible):
#   AGENT_HOST=<host>                 selects ${AGENT_HOST} secret paths
#   AGENT_SERVICES="postgres traefik …"  which services to render (see files/services.tab)
#   INFISICAL_ADDRESS=<url>           override only on the Infisical host (internal addr)
#   INFISICAL_CLIENT_ID / _SECRET     machine-identity creds (on the Infisical host,
#                                     Ansible may pre-write /dev/shm creds instead)

x-agent: &agent
  image: docker.io/infisical/cli:${INFISICAL_AGENT__VERS_TAG:?err}
  container_name: infisical-agent
  entrypoint: [ "/bin/sh", "/agent/entrypoint.sh" ]
  volumes:
    - ../files/entrypoint.sh:/agent/entrypoint.sh:ro
    - ../files/services.tab:/agent/services.tab:ro
    - ../files/configs:/agent-configs:ro      # custom templates live in configs/templates
    - /dev/shm:/dev/shm                        # read creds + write rendered <stack>.env files
  restart: unless-stopped
  # The agent stays "running" even when a template/auth permanently fails, so
  # liveness never flips it. entrypoint.sh stamps /tmp/agent.last_err with the
  # epoch of every ERR/FTL/PNC line; we flag unhealthy only while an error was
  # logged within the last 180s. A window (not a plain grep) because the agent is
  # SILENT on success — a still-broken agent re-logs within the window and stays
  # unhealthy; once errors stop, the stamp ages past 180s and it recovers on its
  # own, no restart. `$$` escapes `$` past compose interpolation so the arithmetic
  # runs in the container shell, not at compose-parse time.
  healthcheck:
    test: [ "CMD-SHELL", "[ ! -f /tmp/agent.last_err ] || [ $$(( $$(date +%s) - $$(cat /tmp/agent.last_err) )) -ge 180 ]" ]
    interval: 30s
    timeout: 5s
    retries: 2
    start_period: 30s

x-agent-env: &agent-env
  AGENT_HOST: ${AGENT_HOST:?err}
  AGENT_SERVICES: ${AGENT_SERVICES:?err}
  INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
  INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}

services:
  agent:
    <<: *agent
    environment:
      <<: *agent-env
      # Public Infisical URL by default; the Infisical host overrides this to the
      # internal address (http://infisical-app:8080) via its per-host env.
      INFISICAL_ADDRESS: ${INFISICAL_ADDRESS:-https://infisical.homektb.com}
    # Always join the proxy network: harmless on a plain node, and required on the
    # Infisical host to reach `infisical-app` directly before Traefik / the public
    # URL exist. Ansible owns/creates `proxy` at host provisioning time.
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: proxy

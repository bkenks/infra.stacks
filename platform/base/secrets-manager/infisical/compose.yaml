name: infisical

include:
  - path:
      - ./compose/stack.yml
      - ./compose/secrets.yml
    env_file:
      - ./interpolation-envs/general.env
      - ./interpolation-envs/production.env
      - /dev/shm/infisical-bootstrap.env # For bootstrapping Infisical. Needs to exist for container startup

# No profiles: app/db/redis are the only services and all start together. (The
# Infisical AGENT lives in its own stack, stack.node/infisical-agent.)

# =============================================================================
# Secrets Manager — group entrance compose (its own project: `secrets-manager`).
# =============================================================================
# Deploys Infisical + its rendering agent as ONE unit (run from THIS dir):
#   cd secrets-manager && docker compose up -d
# Each member is also independently deployable from its own dir.
#
# Members: infisical (app + db + redis), infisical-agent (renders /dev/shm/*.env).
#
# NOTE: most hosts run ONLY the agent (Infisical itself lives on the control
# plane). On a node, deploy secrets-manager/infisical-agent on its own, not this
# whole group.
#
# Required deploy vars (per host, at deploy time — see .env / Ansible / Komodo):
#   AGENT_HOST            this host's name (drives ${AGENT_HOST} secret paths)
#   AGENT_SERVICES        which services this host renders (services.tab keys)
#   INFISICAL_ADDRESS     Infisical URL (public default; the Infisical host
#                         overrides to http://infisical-app:8080)
#   INFISICAL_CLIENT_ID / INFISICAL_CLIENT_SECRET   agent machine-identity creds
#   (Infisical's own tier-0 bootstrap secrets render to
#    /dev/shm/infisical-bootstrap.env — written by Ansible on the control plane.)
name: secrets-manager

include:
  - ./infisical/compose.yaml
  - ./infisical-agent/compose.yaml

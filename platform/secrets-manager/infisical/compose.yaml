# Parent compose — Komodo deploy entrypoint for the infisical stack.
# Hand-written (NOT generated). Includes the jsonnet-rendered service defs and
# declares the interpolation env_file: the shared platform secret file Ansible
# renders (/dev/shm/platform.env). infisical IS the secrets server, so it can't
# pull its own secrets from the Infisical agent (chicken-and-egg) — but Ansible
# bootstraps platform.env independently, so its ${INFISICAL_*} values come from
# there. Komodo targets THIS file.
name: infisical
include:
  - path: ./compose.stack.yaml
    env_file: /dev/shm/platform.env

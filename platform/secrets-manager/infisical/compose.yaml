# Parent compose — Komodo deploy entrypoint for the infisical stack.
# Hand-written (NOT generated). Includes the jsonnet-rendered service defs.
# No interpolation env_file: infisical IS the secrets server, so it can't pull
# its own secrets from the agent (chicken-and-egg). Its ${INFISICAL_*} values
# come from Komodo's stack Environment at deploy. Komodo targets THIS file.
name: infisical
include:
  - ./compose.stack.yaml

# —————————————————————
# SETUP
[tools]
go-jsonnet = "0.22.0"
uv = "0.12.1"         # TODO: remove after bash script
lefthook = "2.1.10"
yamllint = "1.38.0"
vendir = "0.46.0"
yq = "4.53.3"

[env]
LEFTHOOK = 0

[hooks]
postinstall = """
lefthook install
mise run deps-vendir
"""

[tasks.deps-vendir]
description = "Pull vendir dependencies"
run = "vendir sync -f .config/vendir.yml --lock-file .config/vendir.lock.yml"
alias = ["deps-vendir", "deps"]
# SETUP
# —————————————————————


# —————————————————————
# LINT
[tasks.lint-yaml]
description = "Lint YAML files"
run = "yamllint -c .config/yamllint.yml ."
alias = ["lint-yaml", "lint"]
# LINT
# —————————————————————


# —————————————————————
# BUILD
[tasks.render-compose]
description = "Render all .jsonnet files to .yaml for Docker Compose"
run = ".kmods/composonnet/jsonnet/scripts/render-compose.py"
alias = ["render-compose", "render"]
# — configuration vars —
env.RENDER_COMPOSE_SRC = "src"
env.RENDER_COMPOSE_JPATH = ".kmods/composonnet/jsonnet/lib"
# BUILD
# —————————————————————


# —————————————————————
# SYNC
[tasks.pull-template]
description = 'Pull latest changes from the template this repo was generated from.'
run = "copier update --answers-file .config/.copier-answers.yml"
alias = "pull-template"
# SYNC
# —————————————————————

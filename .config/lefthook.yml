---
pre-commit:
  jobs:
    - name: "[1/3] FORMAT MISE CONFIG"
      run: |
        echo "INFO || running cmd - mise fmt"
        mise fmt
        echo "INFO || completed successfully"
      stage_fixed: true

    - name: "[2/3] LINT YAML FILES"
      run: |
        echo "INFO || running mise task..."
        mise run lint-yaml
        echo "INFO || completed successfully"

    - name: "[3/3] JSONNET -> YAML"
      run: |
        echo "INFO || running mise task..."
        mise run render-compose | git add --pathspec-from-file=-
        echo "INFO || completed successfully"

pre-commit:
  jobs:
    - name: render
      run: |
        set -euo pipefail
        # render.py prints every file it wrote or removed on stdout (summary on stderr),
        # so the commit stages the generated files beside their .jsonnet sources without
        # sweeping in anything the author deliberately left unstaged.
        mise run render | tr '\n' '\0' | xargs -0 git add -A --

# —————————————————————
# SETUP
[tools]
go-jsonnet = "0.22.0"
uv = "0.12.1"         # runtime for devlib/render.py
lefthook = "2.1.10"
yq = "4.53.3"
d2 = "latest"

[hooks]
postinstall = "lefthook install"
# SETUP
# —————————————————————


# —————————————————————
# BUILD
[tasks.render]
description = "Render every .jsonnet under src/ into the .yaml beside it"
run = "./devlib/render.py"
alias = ["render-compose", "render"]
# BUILD
# —————————————————————


# —————————————————————
# SYNC
[tasks.pull-template]
description = 'Pull latest changes from the template this repo was generated from.'
run = "copier update --answers-file .config/.copier-answers.yml"
alias = "pull-template"
# SYNC
# —————————————————————

[tools]
# render.py shells out to `jsonnet` (Go implementation) and runs under `uv run`.
# lefthook drives the pre-commit build. python backs uv's requires-python >=3.11.
go-jsonnet = "0.22.0"
uv = "0.11.30"
lefthook = "2.1.10"
python = "3.13"

[tasks.render]
description = "Rebuild the .deploy/ tree from src/"
run = "./.jsonnet/render.py"

[hooks]
# `mise install` also wires up the git hooks, so one command onboards a clone.
postinstall = "lefthook install"

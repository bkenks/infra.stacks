[tools]
go-jsonnet = "0.22.0"
uv = "0.12.1"           # runtime for .vendir/libsonnet/render.py
vendir = "0.46.1"       # vendors lib_compose into .vendir/libsonnet/
lefthook = "2.1.10"
yq = "4.53.3"
d2 = "latest"
"npm:likec4" = "latest"

[hooks]
postinstall = "lefthook install"

[vars]
path_c4 = "docs/c4"

# BUILD —————————————————————
[tasks.vendor]
description = "Sync .vendir/libsonnet/ from the lib_compose library pinned in vendir.yml"
sources = ["vendir.yml"]
run = "vendir sync"

[tasks.render]
description = "Render every .jsonnet under src/ into the .yaml beside it"
run = "./.vendir/libsonnet/render.py"
alias = ["render-compose", "render"]


# DOCS —————————————————————
[tasks."c4:validate"]
description = "Validate the LikeC4 model"
run = "likec4 validate --json --no-layout {{vars.path_c4}}"

[tasks."c4:build"]
run = "likec4 build -o docs/c4/dist docs/c4/diagram"
[tasks.c4]
description = "Serve LikeC4 diagrams locally"
run = "likec4 serve {{vars.path_c4}}"

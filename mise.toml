[tools]
go-jsonnet = "0.22"
uv = "0.12"         # runtime for .vendir/libsonnet/render.py
vendir = "0.46"     # vendors lib_compose into .vendir/libsonnet/
lefthook = "2"
yq = "4"
"npm:likec4" = "1"

[hooks]
postinstall = "lefthook install"

[vars]
path_c4 = "docs/c4"

# BUILD —————————————————————
[tasks.libraries]
description = "Sync libraries pinned in vendir.yml to .vendir/"
sources = ["vendir.yml"]
run = "vendir sync"

[tasks.render]
description = "Render every .jsonnet under src/ into the .yaml beside it"
run = "./.vendir/libsonnet/render.py"
alias = ["render-compose", "render"]


# DOCS —————————————————————
[tasks."c4:validate"]
description = "Validate the LikeC4 model"
run = "likec4 validate --json --no-layout {{vars.path_c4}}"

[tasks."c4:build"]
run = "likec4 build -o docs/c4/dist docs/c4/diagram"
[tasks.c4]
description = "Serve LikeC4 diagrams locally"
run = "likec4 serve {{vars.path_c4}}"

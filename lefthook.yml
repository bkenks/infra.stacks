pre-commit:
  # bash (not the default sh/dash) so `set -e` aborts the commit on a render failure.
  shell: bash
  jobs:
    # render.py is a total rebuild of .deploy/, not a per-file render, so there is no
    # glob and no incremental/full split: one job covers a .jsonnet edit, a
    # registry.libsonnet edit that reaches every stack, and a plain asset edit
    # (files/entrypoint.sh, periphery.env, …) that is copied into .deploy just like a
    # rendered file is. Any of them would otherwise leave .deploy stale. The whole build
    # is ~0.5s for all 39 entrypoints, so running it unconditionally is cheaper than
    # deciding when to skip it.
    - name: build-deploy-tree
      run: |
        set -eo pipefail
        mise run render
        git add -A -- .deploy

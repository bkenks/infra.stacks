[[stack]]
name = "infisical"
[stack.config]
server = "rick"
project_name = "infisical"
destroy_before_deploy = true
linked_repo = "infra.stacks"
run_directory = "./src/platform/secrets-manager/infisical"
file_paths = ["compose.yaml"]
environment = """
# Uncomment if deploying from Ansible generated env
ANSIBLE_SECRETS_FILE=/dev/shm/secrets/bootstrap.env

# ----- Merged stack: server + agent on the Infisical host -----
COMPOSE_PROFILES = 'server,agent'

# ----- Agent credentials -----
INFISICAL_CLIENT_ID     = [[LITTLEBUDDY__AGENT_CLIENT_ID]]      # Set in Komodo variables (toggle secret on to prevent upload to Repo)
INFISICAL_CLIENT_SECRET = [[LITTLEBUDDY__AGENT_CLIENT_SECRET]]  # Set in Komodo variables (toggle secret on to prevent upload to Repo)

# ----- Secrets Rendering -----
# INFISICAL_ADDRESS intentionally unset: defaults to http://infisical_app:8080,
# reachable in-stack, so the agent does not depend on the published port or the edge.
AGENT_HOST      = 'littlebuddy'
NS              = [[INFSCL_AGNT_NODE_SECERTS]]
PS              = [[INFSCL_AGNT_PANGOLIN_SECERTS]]
AGENT_SERVICES  = "${NS} ${PS} zerobyte postgres docuseal forgejo openproject woodpecker komodo-mcp paperless"
"""


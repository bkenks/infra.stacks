[[action]]
name = "Clean: Repos"
[action.config]
file_contents = """
// Run actions using the pre initialized 'komodo' client.
const servers: Types.ListServersResponse = await komodo.read("ListServers", {});

for (const server of servers) {
  console.log(`\n=== ${server.name} ===`);
  await komodo.execute_server_terminal(
    {
      server: server.name,
      command: "rm -rf /etc/komodo/repos/*",
      init: { command: "bash" },
    },
    {
      onLine: (line) => console.log(`[${server.name}] ${line}`),
      onFinish: (code) => console.log(`[${server.name}] exit code: ${code}`),
    },
  );
}
"""

##

[[action]]
name = "Scaffold Docker Networks"
[action.config]
file_contents = """
// Run actions using the pre initialized 'komodo' client.
const servers: Types.ListServersResponse = await komodo.read("ListServers", {});

// Access arguments using the 'ARGS' object.
// ARGS.networks: [{ name: "shared__caddy", driver: "bridge" }, { name: "shared__ts-gateway" }, ...]
const networks: { name: string; driver?: string }[] = ARGS.networks;

if (!networks?.length) {
  throw new Error("Missing required arg: networks");
}

for (const server of servers) {
  console.log(`\n=== ${server.name} ===`);
  for (const { name, driver = "bridge" } of networks) {
    await komodo.execute_server_terminal(
      {
        server: server.name,
        command: `docker network inspect ${name} >/dev/null 2>&1 || docker network create --driver ${driver} ${name}`,
        init: { command: "bash" },
      },
      {
        onLine: (line) => console.log(`[${server.name}] [${name}] ${line}`),
        onFinish: (code) => console.log(`[${server.name}] [${name}] exit code: ${code}`),
      },
    );
  }
}
"""
arguments_format = "yaml"
arguments = """
networks:
  - name: shared__ts-dokr-gw
"""

